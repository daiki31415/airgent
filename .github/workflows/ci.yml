name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun-version: ['latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Environment debug
        run: |
          uname -a
          bun --version
          which xzcat || true
          which bzcat || true
          which lzcat || true
          echo $SHELL

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        id: lint
        run: bun run lint
        continue-on-error: true

      - name: Auto-fix lint (Ubuntu only, PR only)
        if: steps.lint.outcome == 'failure' && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: |
          bunx @biomejs/biome check --write .
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-fix lint issues via biome [ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Run typecheck
        run: bun run typecheck

      - name: Run setup stubs
        run: node scripts/setup-test-stubs.mjs

      - name: Run tests
        run: bun test --isolate 2>&1 || (bun test --isolate --reporter=junit > /tmp/results.xml 2>&1; cat /tmp/results.xml; exit 1)